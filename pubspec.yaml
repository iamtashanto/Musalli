name: musalli
description: "Musalli (মুসল্লি) — Bangla-first offline Islamic salah learning app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  adhan_dart: 2.0.1
  audio_session: 0.2.4
  cupertino_icons: 1.0.9
  device_info_plus: 13.3.0
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_animate: 4.5.2
  flutter_local_notifications: 22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  geolocator: 14.1.2
  go_router: 18.1.3
  home_widget: 0.10.0
  intl: 0.20.3
  json_annotation: 4.12.0
  just_audio: 0.10.6
  path: 1.9.1
  path_provider: 2.1.6
  riverpod_annotation: 4.0.7
  sensors_plus: 7.1.1
  shared_preferences: 2.5.6
  sqlite3: 3.5.2
  sqlite3_flutter_libs: 0.6.0+eol
  timezone: 0.11.2
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  json_serializable: 6.15.2
  riverpod_generator: 4.0.9
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/content/
    - assets/data/
    - assets/fonts/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
